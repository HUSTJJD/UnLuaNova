[CommonSettings]
; See Game_Gather.ini: these were hard-coded to a UE_4.26 install on one machine.
; ManifestDependencies are optional; set them locally against your own engine build
; if you need engine manifest de-duplication, and never commit an absolute path.
; ManifestDependencies=<Engine>/Content/Localization/ToolTips/ToolTips.manifest
; ManifestDependencies=<Engine>/Content/Localization/Keywords/Keywords.manifest
; ManifestDependencies=<Engine>/Content/Localization/Category/Category.manifest
; ManifestDependencies=<Engine>/Content/Localization/Engine/Engine.manifest
; ManifestDependencies=<Engine>/Content/Localization/Editor/Editor.manifest
SourcePath=Content/Localization/UnLuaNova
DestinationPath=Content/Localization/UnLuaNova
ManifestName=UnLuaNova.manifest
ArchiveName=UnLuaNova.archive
NativeCulture=zh-Hans
CulturesToGenerate=zh-Hans

[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/UnLuaNova/Source
ExcludePathFilters=Config/Localization/*
FileNameFilters=*.h
FileNameFilters=*.cpp
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=true

[GatherTextStep1]
CommandletClass=GatherTextFromMetadata
IncludePathFilters=Plugins/UnLuaNova/Source/*
InputKeys=ToolTip
InputKeys=DisplayName
InputKeys=Category
OutputNamespaces=UObjectToolTips
OutputNamespaces=UObjectDisplayNames
OutputNamespaces=UObjectCategory
OutputKeys="{FieldPath}"
OutputKeys="{FieldPath}"
OutputKeys="{FieldPath}"
ShouldGatherFromEditorOnlyData=true

[GatherTextStep2]
CommandletClass=GenerateGatherManifest

[GatherTextStep3]
CommandletClass=GenerateGatherArchive

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=UnLuaNova.csv
bConflictReport=true
ConflictReportName=UnLuaNova_Conflicts.txt

