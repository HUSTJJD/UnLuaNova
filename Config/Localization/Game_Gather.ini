[CommonSettings]
; ManifestDependencies are optional de-duplication inputs. The committed values used to
; point at a UE_4.26 install on one maintainer's machine
; ("../../Program Files/Epic Games/UE_4.26/..."), which is wrong for every other engine
; version and absent on a clean checkout. Uncomment locally and point at YOUR engine's
; Content/Localization directory if you need engine manifest de-duplication; do not
; commit a machine-specific path back.
; ManifestDependencies=<Engine>/Content/Localization/Engine/Engine.manifest
; ManifestDependencies=<Engine>/Content/Localization/Editor/Editor.manifest
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
CulturesToGenerate=en

[GatherTextStep0]
CommandletClass=GenerateGatherManifest

[GatherTextStep1]
CommandletClass=GenerateGatherArchive

[GatherTextStep2]
CommandletClass=GenerateTextLocalizationReport
bWordCountReport=true
WordCountReportName=Game.csv
bConflictReport=true
ConflictReportName=Game_Conflicts.txt

