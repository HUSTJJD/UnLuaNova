name: Documentation

# GitHub Actions only builds and publishes the documentation site. Unreal Engine is
# far too large for a hosted runner: all compilation, automation tests, type checks,
# packaging and release gates run locally through Tools/RunTests.ps1. Do not add
# code-checking jobs to this workflow.

on:
  push:
    branches: ["master"]
    paths:
      - "Docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs toolchain
        # requirements-docs.txt keeps the major version bounded so --strict does not
        # break on an upstream release. Pin an exact version locally once verified.
        run: pip install -r requirements-docs.txt
      - name: Build docs
        # --strict turns warnings into a build failure, which is the only way a broken
        # internal link gets noticed before it is on the site. It is off by default and has
        # to be earned: every file in nav must exist and every relative link in Docs/ must
        # resolve, or this job goes red.
        run: mkdocs build --strict --site-dir _site
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
