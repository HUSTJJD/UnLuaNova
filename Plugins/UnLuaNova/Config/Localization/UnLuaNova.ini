[CommonSettings]
SourcePath=Plugins/UnLuaNova/Content/Localization/UnLuaNova
DestinationPath=Plugins/UnLuaNova/Content/Localization/UnLuaNova
ManifestName=UnLuaNova.manifest
ArchiveName=UnLuaNova.archive
PortableObjectName=UnLuaNova.po
ResourceName=UnLuaNova.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=zh-Hans

;Gather text from source code
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Plugins/UnLuaNova/Source/
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.c
FileNameFilters=*.inl
FileNameFilters=*.mm
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive

;Import localized PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export  PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true