; ============================================================================
; UnLuaNova —— 全插件**唯一**的配置文件
;
; 两个设置类都指向这一份文件（UCLASS(Config=UnLuaNova)）。
; 配置入口只有一个：改任何开关都在这里，不存在第二份 ini。
;
; 两个 section 的分工：
;   [/Script/UnLuaNova.UnLuaNovaSettings]        运行时 + 特性开关（两个后端都要）
;   [/Script/UnLuaNovaEditor.UnLuaNovaEditorSettings]  编辑器行为 + 构建配置（仅编辑器）
;
; 这里写的是**默认值**。工程侧 Config/DefaultUnLuaNova.ini 只写覆盖项，别整份抄 ——
; 抄了之后插件升级改默认值，工程那份还停在旧值上，而且看不出来。
;
; [需重编] = 编译期开关：UnLuaNova.Build.cs 读**工程** Config/DefaultUnLuaNova.ini。
; 插件自带的这份 Build.cs 不读（UBT 只认工程 Config/），改这类键要改工程那份。
; ============================================================================

; ---------------------------------------------------------------------------
; 运行时 + 特性开关
; ---------------------------------------------------------------------------
[/Script/UnLuaNova.UnLuaNovaSettings]

; ---- 运行时 ----
; 环境启动后自动执行的模块名；留空则启动时不执行任何脚本
StartupModuleName=
; 死循环检测超时（秒），0 = 关闭
DeadLoopCheck=0
; 悬垂指针检测
DanglingCheck=False
; 崩溃时打印所有 Lua 环境栈
bPrintLuaStackOnSystemError=True
; LuaEnvLocator / LuaModuleLocator 的类：默认值在 C++ 里（ULuaEnvLocator /
; ULuaModuleLocator_ByBinding），这里不写 —— 写死类路径会在重构后变成陈旧值
;EnvLocatorClass=
;ModuleLocatorClass=

; ---- 特性开关 ----
; 格式：键名 b<CamelCase>，查询名是去掉 b 的小写（大小写不敏感）
;   UnLuaNova.HasFeature('timer')  ← bTimer

; 内置库 UnLuaNova.Timer：脚本计时器（native，走世界时间）[需重编]
bTimer=True
; 内置库 UnLuaNova.Event：事件总线（纯 Lua）[需重编]
bEvent=True
; 内置库 UnLuaNova.OOP：脚本面向对象（纯 Lua）[需重编]
bOOP=True
; 允许给"没实现 IUnLuaNovaInterface"的对象绑 Lua 模块。
; 默认关：这是一条安全边界，不是性能开关 —— 开着时凡是匹配上映射表或绑定组件的对象，
; 都会在它不知情的情况下被绑上脚本。
bDataDrivenBinding=False
; lua.dap：把 headless 调试服务接成 DAP 服务供 IDE attach
bDebugAdapter=True
; lua.dap 默认端口（lua.dap start <端口> 可临时覆盖）
DebugAdapterPort=5699

; ---- 绑定 ----
; 类 → Lua 模块映射（数据驱动绑定），数组，工程侧按需追加：
;+ClassModuleBindings=(Class="/Game/Blueprints/BP_Foo.BP_Foo_C",ModuleName="Foo")
; 启动预绑的类，数组（另有 3 个预置项在 C++ 构造函数里）：
;+PreBindClasses=/Script/Engine.GameInstance

; ---------------------------------------------------------------------------
; 编辑器行为 + 构建配置（仅编辑器）
; ---------------------------------------------------------------------------
[/Script/UnLuaNovaEditor.UnLuaNovaEditorSettings]

; ---- Coding ----
; 热重载模式：Manual / Auto / Never
HotReloadMode=Manual
; 是否生成智能提示
bGenerateIntelliSense=True
; 产物目录不存在时，编辑器启动就自动导出一次
bAutoGenerateIntelliSenseOnStartup=True

; ---- Build（全部 [需重编]）----
bAutoStartup=True
bEnableDebug=False
bEnablePersistentParamBuffer=True
bEnableTypeChecking=True
bEnableCallOverriddenFunction=True

; ---- 静态绑定 ----
; 构建期生成的绑定表：属性按 Offset+Kind 直读直写，函数走编译期定型的 thunk。
; 这是插件的核心性能特性，**默认开**，不需要用户想起来才生效。
;
; 生成是**自动**的，不用跑 Commandlet：编辑器启动会比对产物指纹（类型集合的 CRC），
; 缺了或类型有增删就重新生成。
;
; 一点必须知道：产物是 .cpp，重新生成之后要**重编译一次**才进二进制。默认范围
; （ExportedReflected，十来个类型）下这次重编译很轻；但把范围切成 All 之后，
; 每次类型增删都会触发一次大重编译 —— 那时再考虑关掉自动、改由 CI 生成。
bStaticBinding=True
; 产物缺失或类型集合变化时自动重新生成
bAutoGenerateStaticBinding=True
; 生成哪些类型：
;   ExportedReflected = 插件默认静态导出的那批（UObject/UClass/UWorld + FVector 等
;                       数学结构），十来个。默认就是这个。
;   Modules           = 下面 StaticBindingModules 列出的包
;   All               = 全部类型（只排除 meta=(UnLuaNovaNoExport)）
; /Script/Engine 一个包就几千个类型，所以默认不往那边去。
StaticBindingSelection=ExportedReflected
; 仅 StaticBindingSelection=Modules 时生效：
;+StaticBindingModules=/Script/Engine
;+StaticBindingModules=/Script/UMG
; 产物目录；留空 = Source/<工程模块>/Generated。别改到模块目录外，否则 UBT 不编译。
;StaticBindingOutputDir=
; FText 不再被当成字符串。**故意不写**：C++ 属性默认 true，而 Build.cs 里
; UNLUANOVA_ENABLE_FTEXT 默认 false —— 两边不一致，真正生效的是宏（默认关）。
; 在把属性默认值统一成 false 之前，这里写哪个都会对不上。待修。
;bEnableFText=False
; 把 Lua 模块当 C++ 代码编译
bLuaCompileAsCpp=False
; 指定的 Lua 版本（仅展示）
LuaVersion=lua-5.4.3

; ---- Legacy（全部 [需重编]）----
; 创建 UE 命名空间 table
bWithUE4Namespace=True
; 出参放在返回值之前
bLegacyReturnOrder=False
; 蓝图类路径自动补 '_C'
bLegacyBlueprintPath=False
; 允许带 UTF-8 BOM 的 lua 文件
bLegacyAllowUTF8WithBOM=False
; 从 UE 调用时参数按指针传递
bLegacyArgsPassing=True

; ---- System ----
; Start / Manual / None
UpdateMode=Start

; Lua 后端：Lua / Luau（默认 Luau）
; 注意：这不是 UPROPERTY（Build.cs 直接从**工程** ini 读这个键），所以编辑器 UI 里看不到，
; 也只能写在工程 Config/DefaultUnLuaNova.ini。
LuaBackend=Luau
