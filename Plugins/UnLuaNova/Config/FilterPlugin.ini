; Additional files bundled by UAT BuildPlugin. Paths are relative to the
; plugin root (here: Plugins/UnLuaNova). Source/ (including the vendored Lua
; and Luau sources) and Content/ are already included by UAT defaults.
; The two .ubtignore files MUST ship: UBT relies on them to avoid compiling
; lua.c / the Luau CLI directly.
; LICENSE / LICENSE-THIRD-PARTY.md / README.md live at the repository root
; and are shipped at the zip root of the source release archive instead.
[FilterPlugin]
/Config/...
/Source/ThirdParty/LuaLib/Lua/.ubtignore
/Source/ThirdParty/LuauLib/Luau/.ubtignore
/Content/IntelliSense/...
