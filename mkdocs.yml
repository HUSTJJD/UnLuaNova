site_name: UnLuaNova
site_description: 面向 Unreal Engine 的 Lua 脚本方案，Tencent/UnLua 的社区续作
site_url: https://hustjjd.github.io/UnLuaNova/
repo_url: https://github.com/HUSTJJD/UnLuaNova
repo_name: HUSTJJD/UnLuaNova
edit_uri: blob/master/Docs/
docs_dir: Docs
exclude_docs: |
  Archive/

theme:
  name: material
  language: zh
  logo: Images/UnLuaNova.png
  favicon: Images/UnLuaNova.png
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/HUSTJJD/UnLuaNova
      name: GitHub
    - icon: material/book-open-variant
      link: https://github.com/Tencent/UnLua
      name: Upstream Tencent/UnLua

nav:
  - 首页: index.md
  - 中文文档:
      - CN/index.md
      - 入门:
          - UE 新手快速上手: CN/Quickstart_For_UE_Newbie.md
          - 功能清单: CN/Features.md
      - 编程:
          - 编程指南: CN/UnLuaNova_Programming_Guide.md
          - Luau 后端: CN/Luau.md
          - API 参考: CN/API.md
          - C++ API 参考: CN/CxxApi.md
          - 架构: CN/Architecture.md
          - 如何实现覆写: CN/How_To_Implement_Overriding.md
          - 静态导出绑定: CN/StaticExportBinding.md
      - 配置与工具:
          - 设置项: CN/Settings.md
          - 控制台命令: CN/ConsoleCommand.md
          - 自定义模板: CN/CustomTemplate.md
          - 自定义碰撞枚举: CN/CollisionEnum.md
          - 插件与模块: CN/Plugins_And_Modules.md
      - 诊断与质量:
          - 调试: CN/Debugging.md
          - 智能提示: CN/IntelliSense.md
          - 测试与自动化: CN/Testing.md
          - 测试报告 Lua: test-lua-report.md
          - 测试报告 Luau: test-luau-report.md
      - 参考:
          - Showcase 示例: CN/Showcase.md
          - 许可与商业授权: CN/License.md
          - 常见问题 FAQ: CN/FAQ.md
  - English Docs:
      - EN/index.md
      - Getting Started:
          - Quickstart for UE Newcomers: EN/Quickstart_For_UE_Newbie.md
          - Features: EN/Features.md
      - Programming:
          - Programming Guide: EN/UnLuaNova_Programming_Guide.md
          - Luau Backend: EN/Luau.md
          - API Reference: EN/API.md
          - C++ API Reference: EN/CxxApi.md
          - Architecture: EN/Architecture.md
          - How To Implement Overriding: EN/How_To_Implement_Overriding.md
          - Static Export and Binding: EN/StaticExportBinding.md
      - Configuration and Tools:
          - Settings: EN/Settings.md
          - Console Commands: EN/ConsoleCommand.md
          - Custom Lua Templates: EN/CustomTemplate.md
          - Custom Collision Enums: EN/CollisionEnum.md
          - Plugins and Modules: EN/Plugins_And_Modules.md
      - Diagnostics and Quality:
          - Debugging: EN/Debugging.md
          - IntelliSense: EN/IntelliSense.md
          - Testing and Automation: EN/Testing.md
          - Test reports: EN/TestReports.md
      - Reference:
          - Showcase Samples: EN/Showcase.md
          - License: EN/License.md
          - FAQ: EN/FAQ.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - meta
  - tables
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

